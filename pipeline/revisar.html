<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão · Novos Conhecimentos</title>
<link rel="stylesheet" href="../css/estilo.css">
<style>
  body { padding: 0 16px 48px; }
  .rev { max-width: 1500px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: 200px 390px 390px 1fr; align-items: start; }
  @media (max-width: 1240px) { .rev { grid-template-columns: 1fr; } }
  .cab { max-width: 1180px; margin: 0 auto; padding: 16px 0; display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--regra); margin-bottom: 20px; }
  .abas-rev { display: flex; gap: 8px; }
  .abas-rev button { width: auto; padding: .5rem .8rem; }
  .fila { display: grid; max-height: 80vh; overflow: auto; }
  .fila button { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--regra-2); padding: .55rem .2rem; cursor: pointer; display: grid; gap: 2px; }
  .fila button[aria-current] { background: var(--selecao); }
  .fila .sinais { font: .68rem var(--mono); color: var(--tinta-3); }
  .telefone { transform: translateZ(0); height: 720px; overflow: auto; border: 7px solid #111; border-radius: 30px; background: var(--cartao); padding: 0 14px 90px; }
  .telefone .licao { min-height: 0; }
  .painel-rev { display: grid; gap: 14px; }
  textarea { width: 100%; border: 1px solid var(--regra); background: var(--ficha); color: var(--tinta); font: .82rem/1.45 var(--mono); padding: .6rem; border-radius: 0; }
  .decidir { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .msg { font: .82rem var(--mono); margin: 0; }
  .triagem { max-width: 1180px; margin: 0 auto; display: grid; gap: 0; }
  .tri { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; border-bottom: 1px solid var(--regra-2); padding: .7rem 0; }
  .tri .acoes-tri { display: flex; gap: 6px; }
  .tri .acoes-tri button { width: auto; padding: .45rem .7rem; }
  .tri.decidido { opacity: .5; }
</style>
</head>
<body>
<div class="cab">
  <div>
    <p class="rotulo">Revisão por pares</p>
    <p class="ficha-gancho" id="placar">&nbsp;</p>
  </div>
  <div class="abas-rev">
    <button class="btn" id="ver-licoes">Lições</button>
    <button class="btn fio" id="ver-triagem">Curadoria do catálogo</button>
  </div>
</div>

<div class="rev" id="modo-licoes">
  <nav class="fila" id="fila" aria-label="Pares na fila"></nav>
  <div><p class="rotulo" id="rot-a">Versão A</p><div class="telefone" id="tel-a"><p class="vazio" style="padding:2rem 0">Escolha um par na fila.</p></div></div>
  <div><p class="rotulo">Versão B</p><div class="telefone" id="tel-b"></div></div>
  <form class="painel-rev" id="painel" hidden>
    <div><p class="rotulo" id="p-area"></p><p class="ficha-termo" style="font-size:1.6rem;margin:.2rem 0" id="p-termo"></p></div>
    <p class="ficha-gancho" style="font-size:.85rem;margin:0" id="p-dica"></p>
    <label class="rotulo" for="comentario">Por quê (opcional, calibra o juiz)</label>
    <textarea id="comentario" rows="4" placeholder="Ex.: a B explica antes de mostrar; a A começa pelo exemplo."></textarea>
    <div class="decidir">
      <button type="button" class="btn" data-e="a">Fica a A</button>
      <button type="button" class="btn" data-e="b">Fica a B</button>
    </div>
    <button type="button" class="btn fio" data-e="nenhuma">Nenhuma serve</button>
    <button type="button" class="btn fio" id="vetar" hidden>Tirar do ar</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>
</div>

<div class="triagem" id="modo-triagem" hidden>
  <p class="ficha-gancho" style="margin:0 0 1rem">O JEV achou que estes termos do catálogo podem não ter respaldo suficiente (controverso ou especulativo). O número é a probabilidade somada. Decida: manter ou tirar do app. Nada é apagado até aplicarmos as decisões juntos.</p>
  <div id="tri-lista"></div>
</div>

<script src="../js/licao.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let atual = null, AREAS = {};
fetch("/dados/indice.json").then(r => r.json()).then(i => AREAS = i.areas);

async function carregarFila(escolher) {
  const f = await fetch("/api/pares").then(r => r.json());
  $("#placar").textContent = `${f.pendentes.length} par(es) para escolher · ${f.escolhas} escolha(s) feita(s), o juiz acertou ${f.concordancia} · ${f.publicadas.length} no ar no formato novo`;
  const item = (x, sinal) => `<button data-id="${x.id}"><span class="item-lista termo" style="border:0;padding:0">${x.termo}</span><span class="sinais">${x.area}${sinal}</span></button>`;
  $("#fila").innerHTML = (f.pendentes.map(x => item(x, "")).join("") || `<p class="vazio">Nenhum par esperando.</p>`)
    + (f.publicadas.length ? `<p class="rotulo" style="margin:1rem 0 .3rem">No ar</p>` + f.publicadas.map(x => item(x, " · no ar")).join("") : "");
  document.querySelectorAll("#fila button").forEach(b => b.addEventListener("click", () => abrir(b.dataset.id)));
  const alvo = escolher || (f.pendentes[0] && f.pendentes[0].id);
  if (alvo) abrir(alvo);
}

async function abrir(id) {
  const r = await fetch("/api/par/" + id).then(r => r.json());
  atual = r;
  document.querySelectorAll("#fila button").forEach(b => b.toggleAttribute("aria-current", b.dataset.id === id));
  $("#p-area").textContent = r.doc.area;
  $("#p-termo").textContent = r.doc.termo;
  $("#rot-a").textContent = r.publicada ? "No ar" : "Versão A";
  $("#p-dica").textContent = r.publicada ? "Esta lição está no ar. Tirar do ar devolve o conceito para a produção."
    : "Toque as duas até o fim e fique com a que você terminaria e contaria a alguém. A escolha do juiz aparece depois da sua.";
  /* cada botão só aparece se a versão dele existe; lição no ar só pode ser vetada */
  document.querySelectorAll("[data-e]").forEach(b => b.hidden = r.publicada || (b.dataset.e !== "nenhuma" && !r[b.dataset.e]));
  $("#vetar").hidden = !r.publicada;
  $("#comentario").value = ""; $("#msg").textContent = "";
  $("#painel").hidden = false;
  tocar("a", r.a); tocar("b", r.b);
}

function tocar(v, licao) {
  const el = $("#tel-" + v);
  if (!licao) { el.innerHTML = atual.publicada ? "" : `<p class="vazio" style="padding:2rem 0">Esta versão não foi escrita.</p>`; return; }
  Licao(el, { termo: atual.doc.termo, area: atual.doc.area, fontes: atual.doc.fontes, fotos: atual.doc.fotos, licao }, {
    base: "../",   /* esta página fica em /pipeline/; as fotos, em /img/ */
    cor: AREAS[atual.doc.area] ? `var(--m-${AREAS[atual.doc.area]})` : undefined,
    aoFechar: () => tocar(v, licao),
    aoTerminar: (res) => {
      el.innerHTML = `<div class="licao"><p class="rotulo" style="margin-top:1rem">${res.acertos} de ${res.total} perguntas</p>
        <p class="ficha-gancho">${licao.fecho}</p><button type="button" class="btn fio">Ver de novo</button></div>`;
      el.querySelector("button").addEventListener("click", () => tocar(v, licao));
    }
  });
}

async function enviar(rota, corpo) {
  $("#msg").textContent = "Salvando…";
  const r = await fetch(rota, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: atual.id, comentario: $("#comentario").value.trim(), ...corpo }) }).then(r => r.json());
  if (r.erro) { $("#msg").textContent = r.erro; return null; }
  return r;
}
document.querySelectorAll("[data-e]").forEach(b => b.addEventListener("click", async () => {
  const e = b.dataset.e;
  if (e === "nenhuma" && !$("#comentario").value.trim()) { $("#msg").textContent = "Diga o que faltou nas duas: é isso que orienta a próxima escrita."; return; }
  const r = await enviar("/api/escolher", { escolha: e });
  if (!r) return;
  await carregarFila();
  $("#msg").textContent = (e === "nenhuma" ? "As duas voltaram para a produção." : `Publicada a versão ${e.toUpperCase()}.`) + ` O juiz tinha escolhido: ${r.juiz ? r.juiz.toUpperCase() : "nenhuma"}.`;
}));
$("#vetar").addEventListener("click", async () => {
  if (!$("#comentario").value.trim()) { $("#msg").textContent = "Diga por que ela sai do ar."; return; }
  if (await enviar("/api/vetar", {})) { await carregarFila(); $("#msg").textContent = "Saiu do ar e voltou para a produção."; }
});

async function carregarTriagem() {
  const t = await fetch("/api/triagem").then(r => r.json());
  $("#tri-lista").innerHTML = t.itens.map(x => `
    <div class="tri${x.decisao ? " decidido" : ""}" data-id="${x.id}">
      <span class="carimbo ${x.risco > .8 ? "" : "controverso"}">${Math.round(x.risco * 100)}%</span>
      <div><p style="margin:0;font-weight:560">${x.termo}${x.doc ? ' <span class="rotulo">· tem ficha</span>' : ""}</p>
        <p class="ficha-gancho" style="font-size:.85rem">${x.area} · ${x.gancho}</p>
        ${x.decisao ? `<p class="rotulo">decidido: ${x.decisao}</p>` : ""}</div>
      <div class="acoes-tri"><button class="btn fio" data-d="manter">Manter</button><button class="btn" data-d="remover">Tirar</button></div>
    </div>`).join("") || `<p class="vazio">Sem triagem. Rode python pipeline/gerar.py triagem.</p>`;
  document.querySelectorAll(".tri button").forEach(b => b.addEventListener("click", async () => {
    const linha = b.closest(".tri");
    await fetch("/api/curadoria", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: linha.dataset.id, decisao: b.dataset.d }) });
    linha.classList.add("decidido");
    linha.querySelector("div").insertAdjacentHTML("beforeend", `<p class="rotulo">decidido: ${b.dataset.d}</p>`);
  }));
}

function modo(qual) {
  $("#modo-licoes").hidden = qual !== "licoes";
  $("#modo-triagem").hidden = qual !== "triagem";
  $("#ver-licoes").className = qual === "licoes" ? "btn" : "btn fio";
  $("#ver-triagem").className = qual === "triagem" ? "btn" : "btn fio";
  if (qual === "triagem") carregarTriagem();
}
$("#ver-licoes").addEventListener("click", () => modo("licoes"));
$("#ver-triagem").addEventListener("click", () => modo("triagem"));
carregarFila();
</script>
</body>
</html>
